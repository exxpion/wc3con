<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат лобби</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: #1a1a2e;
      padding: 10px 16px;
      border-bottom: 1px solid #2a2a4a;
      font-size: 14px;
      font-weight: 600;
      color: #7eb8f7;
      flex-shrink: 0;
    }

    /* ── Main layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Chat area (left) ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2a2a4a;
      min-width: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }

    .msg {
      margin-bottom: 8px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg-meta {
      font-size: 11px;
      color: #666;
      margin-right: 6px;
    }
    .msg-name {
      font-size: 13px;
      font-weight: 600;
      color: #7eb8f7;
      margin-right: 6px;
    }
    .msg-name.me { color: #50fa7b; }
    .msg-text {
      font-size: 13px;
      color: #ddd;
    }
    .msg-system {
      font-size: 12px;
      color: #555;
      font-style: italic;
      text-align: center;
      margin: 6px 0;
    }

    /* ── Input ── */
    .input-row {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    .input-row input {
      flex: 1;
      padding: 8px 12px;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-row input:focus { border-color: #2563eb; }
    .input-row button {
      padding: 8px 16px;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .input-row button:hover { opacity: 0.85; }
    .input-row button:disabled { background: #333; cursor: not-allowed; opacity: 1; }

    /* ── Players sidebar (right) ── */
    .sidebar {
      width: 160px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .sidebar-title {
      padding: 10px 12px 6px;
      font-size: 12px;
      font-weight: 600;
      color: #7eb8f7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #2a2a4a;
    }
    .player-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .player-list::-webkit-scrollbar { width: 3px; }
    .player-list::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }
    .player-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      font-size: 13px;
    }
    .player-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #50fa7b;
      flex-shrink: 0;
    }
    .player-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-name.me { color: #50fa7b; }

    /* ── Closed overlay ── */
    .closed-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,15,26,0.92);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      font-size: 15px;
      color: #aaa;
    }
    .closed-overlay.show { display: flex; }
  </style>
</head>
<body>

<div class="header">Чат лобби</div>

<div class="main">
  <!-- Left: messages + input -->
  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Написать сообщение..." maxlength="512" autocomplete="off" />
      <button id="sendBtn" onclick="sendMessage()">Отправить</button>
    </div>
  </div>

  <!-- Right: player list -->
  <div class="sidebar">
    <div class="sidebar-title">Участники</div>
    <div class="player-list" id="playerList"></div>
  </div>
</div>

<div class="closed-overlay" id="closedOverlay">
  <span>🏁</span>
  <span>Лобби закрыто</span>
</div>

<script>
  let myUserId = null;

  // ── Helpers ──
  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatTime(ts) {
    const d = new Date(ts);
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function appendMessage(msg) {
    const wrap = document.getElementById('messages');
    const isMe = msg.userId === myUserId;
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML =
      `<span class="msg-meta">${formatTime(msg.ts)}</span>` +
      `<span class="msg-name${isMe ? ' me' : ''}">${esc(msg.username)}:</span>` +
      `<span class="msg-text">${esc(msg.text)}</span>`;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
  }

  function appendSystem(text) {
    const wrap = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg-system';
    div.textContent = text;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
  }

  function renderPlayers(players) {
    const list = document.getElementById('playerList');
    list.innerHTML = players.map(p => {
      const isMe = p.userId === myUserId;
      return `<div class="player-item">
        <div class="player-dot"></div>
        <span class="player-name${isMe ? ' me' : ''}">${esc(p.username)}${isMe ? ' (ты)' : ''}</span>
      </div>`;
    }).join('');
  }

  // ── Send ──
  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    await window.chat.sendMessage(text);
  }

  document.getElementById('msgInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Events from main ──
  window.chat.onMessage((msg) => {
    appendMessage(msg);
  });

  window.chat.onHistory((messages) => {
    for (const msg of messages) appendMessage(msg);
  });

  window.chat.onPlayersUpdate((players) => {
    renderPlayers(players);
  });

  window.chat.onRoomClosed(() => {
    document.getElementById('closedOverlay').classList.add('show');
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('msgInput').disabled = true;
  });
</script>
</body>
</html>
