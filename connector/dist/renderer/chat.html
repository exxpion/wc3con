<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат лобби</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      background: var(--bg2);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* ── Main layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      min-width: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }

    .msg {
      margin-bottom: 8px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg-meta { font-size: 11px; color: var(--text-dim); margin-right: 6px; }
    .msg-name { font-size: 13px; font-weight: 600; color: var(--gold); margin-right: 6px; }
    .msg-name.me { color: var(--green); }
    .msg-text { font-size: 13px; color: var(--text); }
    .msg-system {
      font-size: 12px; color: #555;
      font-style: italic; text-align: center;
      margin: 6px 0;
    }

    /* ── Input ── */
    .input-row {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-row input {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-row input:focus { border-color: var(--gold); }
    .input-row button {
      padding: 8px 16px;
      background: var(--gold);
      border: none;
      border-radius: 6px;
      color: #0c0c0c;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .input-row button:hover { opacity: 0.85; }
    .input-row button:disabled { background: #333; color: #666; cursor: not-allowed; opacity: 1; }

    /* ── Players sidebar ── */
    .sidebar {
      width: 160px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg2);
    }
    .sidebar-title {
      padding: 10px 12px 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    .player-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .player-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      font-size: 13px;
    }
    .player-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }
    .player-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .player-name.me { color: var(--gold); }

    /* ── Closed overlay ── */
    .closed-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(12,12,12,0.92);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      font-size: 15px;
      color: var(--text-dim);
      border-top: 2px solid var(--gold-dim);
    }
    .closed-overlay.show { display: flex; }
    .closed-overlay span:first-child { font-size: 28px; }
  </style>
  <link rel="stylesheet" crossorigin href="./assets/shared-styles-C75wpqMP.css">
</head>
<body>

<div class="header">⚔ Чат лобби</div>

<div class="main">
  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Написать сообщение..." maxlength="512" autocomplete="off" />
      <button id="sendBtn" onclick="sendMessage()">Отправить</button>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-title">Участники</div>
    <div class="player-list" id="playerList"></div>
  </div>
</div>

<div class="closed-overlay" id="closedOverlay">
  <span>🏁</span>
  <span>Лобби закрыто</span>
</div>

<script>
  let myUserId = null;

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatTime(ts) {
    const d = new Date(ts);
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function appendMessage(msg) {
    const wrap = document.getElementById('messages');
    const isMe = msg.userId === myUserId;
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML =
      `<span class="msg-meta">${formatTime(msg.ts)}</span>` +
      `<span class="msg-name${isMe ? ' me' : ''}">${esc(msg.username)}:</span>` +
      `<span class="msg-text">${esc(msg.text)}</span>`;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
  }

  function renderPlayers(players) {
    const list = document.getElementById('playerList');
    list.innerHTML = players.map(p => {
      const isMe = p.userId === myUserId;
      return `<div class="player-item">
        <div class="player-dot"></div>
        <span class="player-name${isMe ? ' me' : ''}">${esc(p.username)}${isMe ? ' ✦' : ''}</span>
      </div>`;
    }).join('');
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    await window.chat.sendMessage(text);
  }

  document.getElementById('msgInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  window.chat.onMessage((msg) => appendMessage(msg));
  window.chat.onHistory((messages) => { for (const msg of messages) appendMessage(msg); });
  window.chat.onPlayersUpdate((players) => renderPlayers(players));
  window.chat.onRoomClosed(() => {
    document.getElementById('closedOverlay').classList.add('show');
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('msgInput').disabled = true;
  });
</script>
</body>
</html>
